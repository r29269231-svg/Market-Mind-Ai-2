services:
  # --- FRONTEND (Next.js) ---
  - type: web
    name: marketmind-frontend
    env: node
    rootDir: agent-starter-react
    buildCommand: "pnpm install"
    startCommand: "pnpm dev"
    plan: free
    envVars:
      - key: LIVEKIT_URL
        value: wss://schoolproject-lfkh4pp3.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false     # You’ll fill this in on Render
      - key: LIVEKIT_API_SECRET
        sync: false     # You’ll fill this in on Render
      - key: NEXT_PUBLIC_LIVEKIT_URL
        value: wss://schoolproject-lfkh4pp3.livekit.cloud
      - key: NEXT_PUBLIC_TOKEN_ENDPOINT
        value: /api/connect/route.ts

  # --- BACKEND (Python Agent Worker) ---
  - type: worker
    name: marketmind-backend
    env: python
    rootDir: agent-starter-python
    buildCommand: "uv run python src/agent.py download-files"
    startCommand: "uv run python src/agent.py start"
    plan: free
    envVars:
      - key: LIVEKIT_URL
        value: wss://schoolproject-lfkh4pp3.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
